name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22, 24]
        include:
          - os: ubuntu-latest
            node: 18
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - name: Scaffold an app from the packed tarball
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/scaffold"
          npm pack --pack-destination "$RUNNER_TEMP/scaffold"
          cd "$RUNNER_TEMP/scaffold"
          npm exec --yes --package=./$(ls *.tgz) -- create-local-ai smoke-app --no-git
          test -f smoke-app/server.js && test -f smoke-app/.gitignore
